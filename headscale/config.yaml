# headscaletest POC — Headscale control plane config
#
# Minimal config. Two IP prefixes (matching Tailscale's defaults), SQLite for
# state, MagicDNS on, no OIDC (the user-owned "persona" containers use
# preauth keys, not interactive login).

# Where the control plane says it lives.
# Sidecars reach it at host.docker.internal:8080 during initial registration.
server_url: http://host.docker.internal:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

dns:
  base_domain: headscaletest.ts.net
  magic_dns: true
  nameservers.global:
    - 1.1.1.1
    - 8.8.8.8

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true

# SQLite is enough for a POC. In production use Postgres.
dbtype: sqlite
sqlite:
  path: /var/lib/headscale/db.sqlite

private_key_path: /var/lib/headscale/private.key
noise:
  private_key_path: /var/lib/headscale/noise_private.key

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

ephemeral_node_inactivity_timeout: 30m

log:
  level: info
  format: text